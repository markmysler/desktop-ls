name: Release

# Push a tag like v1.1.0 to build DesktopLS.exe and publish it as a GitHub release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test DesktopLS.sln -c Release

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/DesktopLS/DesktopLS.csproj -c Release -o publish -p:Version=$version

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: DesktopLS ${{ github.ref_name }}
          files: publish/DesktopLS.exe
          generate_release_notes: true
