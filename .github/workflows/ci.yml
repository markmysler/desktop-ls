name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build DesktopLS.sln -c Release

      - name: Test
        run: dotnet test DesktopLS.sln -c Release --no-build --verbosity normal

      - name: Publish single-file exe
        run: dotnet publish src/DesktopLS/DesktopLS.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopLS
          path: publish/DesktopLS.exe
